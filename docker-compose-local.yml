# Production LAN deployment. Copy .env.local.example to .env once.
# docker compose -f docker-compose-local.yml up -d --build
name: plane-local

x-api-env: &api-env
  DJANGO_SETTINGS_MODULE: plane.settings.production
  DEBUG: "0"
  WEB_URL: ${WEB_URL:?Set WEB_URL in the root .env, including http and port}
  CORS_ALLOWED_ORIGINS: ${WEB_URL}
  SECRET_KEY: ${SECRET_KEY:?Set a permanent SECRET_KEY in the root .env}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?Set LIVE_SERVER_SECRET_KEY in the root .env}
  LIVE_BASE_URL: http://live:3000
  DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@plane-db:5432/${POSTGRES_DB:-plane}
  REDIS_URL: redis://plane-redis:6379/0
  REDIS_HOST: plane-redis
  REDIS_PORT: "6379"
  AMQP_URL: amqp://${RABBITMQ_USER:-plane}:${RABBITMQ_PASSWORD:-plane}@plane-mq:5672/plane
  # Plane calls its same-origin S3 compatibility mode USE_MINIO; RustFS uses it too.
  USE_MINIO: "1"
  MINIO_ENDPOINT_SSL: "0"
  AWS_S3_ENDPOINT_URL: http://plane-rustfs:9000
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-plane-storage}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-plane-storage-secret}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  AWS_REGION: us-east-1
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-52428800}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  ENABLE_SIGNUP: "1"
  ENABLE_EMAIL_PASSWORD: "1"
  ENABLE_MAGIC_LINK_LOGIN: "0"
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}

x-api-build: &api-build
  context: ./apps/api
  dockerfile: Dockerfile.api

x-api-dependencies: &api-dependencies
  plane-db:
    condition: service_healthy
  plane-redis:
    condition: service_healthy
  plane-mq:
    condition: service_healthy
  plane-rustfs:
    condition: service_healthy
  migrator:
    condition: service_completed_successfully

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.web
    restart: unless-stopped
    volumes:
      - ./deployments/local/Caddyfile.app:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-./data}/web/config:/config
      - ${DATA_DIR:-./data}/web/data:/data

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.admin
    restart: unless-stopped
    environment:
      SPA_INDEX: /god-mode/index.html
    volumes:
      - ./deployments/local/Caddyfile.app:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-./data}/admin/config:/config
      - ${DATA_DIR:-./data}/admin/data:/data

  space:
    build:
      context: .
      dockerfile: apps/space/Dockerfile.space
    restart: unless-stopped
    environment:
      # Server-rendered public metadata uses Docker DNS; browser builds use relative URLs.
      API_BASE_URL: http://api:8000

  live:
    build:
      context: .
      dockerfile: apps/live/Dockerfile.live
    restart: unless-stopped
    environment:
      PORT: "3000"
      API_BASE_URL: http://api:8000
      LIVE_BASE_PATH: /live
      CORS_ALLOWED_ORIGINS: ${WEB_URL}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      REDIS_URL: redis://plane-redis:6379/0
    depends_on:
      api:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/live/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build: *api-build
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    environment: *api-env
    volumes:
      - ${DATA_DIR:-./data}/logs/api:/code/plane/logs
    depends_on: *api-dependencies
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/instances/', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 20

  worker:
    build: *api-build
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    environment: *api-env
    volumes:
      - ${DATA_DIR:-./data}/logs/worker:/code/plane/logs
    depends_on:
      <<: *api-dependencies
      api:
        condition: service_healthy

  beat-worker:
    build: *api-build
    restart: unless-stopped
    command: celery -A plane beat -l info --schedule=/code/beat/celerybeat-schedule
    environment: *api-env
    volumes:
      - ${DATA_DIR:-./data}/logs/beat-worker:/code/plane/logs
      - ${DATA_DIR:-./data}/beat:/code/beat
    depends_on:
      <<: *api-dependencies
      api:
        condition: service_healthy

  migrator:
    build: *api-build
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    environment: *api-env
    volumes:
      - ${DATA_DIR:-./data}/logs/migrator:/code/plane/logs
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  plane-mq:
    image: rabbitmq:3.13.6-alpine
    hostname: plane-mq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_DEFAULT_VHOST: plane
    volumes:
      - ${DATA_DIR:-./data}/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 20

  rustfs-init:
    image: alpine:3.22
    user: "0:0"
    restart: "no"
    command: ["sh", "-ec", "chown 10001:10001 /data /logs"]
    volumes:
      - ${DATA_DIR:-./data}/rustfs/data:/data
      - ${DATA_DIR:-./data}/rustfs/logs:/logs

  plane-rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-plane-storage}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-plane-storage-secret}
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    volumes:
      - ${DATA_DIR:-./data}/rustfs/data:/data
      - ${DATA_DIR:-./data}/rustfs/logs:/logs
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 20

  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "${LISTEN_HTTP_PORT:-17239}:80"
    environment:
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    volumes:
      - ./deployments/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-./data}/proxy/config:/config
      - ${DATA_DIR:-./data}/proxy/data:/data
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      space:
        condition: service_healthy
      api:
        condition: service_healthy
      live:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
